name: DevLens AI - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devlens-backend

jobs:

  # ── Verify Deployment Secrets ────────────────────────────────────────────────
  verify-config:
    name: Verify Deployment Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        run: |
          echo "Checking deployment target configuration..."
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Cloudflare token not configured in GitHub repository secrets. Cloudflare deployment skipped."
          else
            echo "Cloudflare token configured."
          fi
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "Production Database URL not configured in GitHub repository secrets. Migration skipped."
          else
            echo "Production Database URL configured."
          fi
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "Railway token not configured in GitHub repository secrets. Backend deployment skipped."
          else
            echo "Railway token configured."
          fi

  # ── Run Database Migrations ──────────────────────────────────────────────────
  migrate:
    name: Run Alembic Migrations
    runs-on: ubuntu-latest
    needs: verify-config
    if: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          cd backend
          alembic upgrade head

  # ── Deploy Backend to Railway ────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend -> Railway
    runs-on: ubuntu-latest
    needs: migrate
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Railway
        uses: railway-app/deploy-action@v1
        with:
          service: devlens-api
          token: ${{ secrets.RAILWAY_TOKEN }}
          environment: production
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Deploy Frontend to Cloudflare Workers ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend -> Cloudflare Workers
    runs-on: ubuntu-latest
    needs: verify-config
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://devlens-api-f0jm.onrender.com' }}
          VITE_WS_URL: ${{ secrets.PRODUCTION_WS_URL || 'wss://devlens-api-f0jm.onrender.com' }}
          VITE_API_KEY: ${{ secrets.PRODUCTION_API_KEY || '4d9f6a1e8c0b2d4f7e5a3c1b9d8e0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d' }}
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

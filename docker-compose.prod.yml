version: "3.9"

# ============================================================
# DevLens AI — Production Stack (Self-Hosted / VPS)
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devlens_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-devlens}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devlens} -d ${POSTGRES_DB:-devlens}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery Broker + Rate Limiter) ───────────────────
  redis:
    image: redis:7-alpine
    container_name: devlens_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: devlens_api_prod
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - repo_cache_prod:/tmp/repos
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Background Worker ───────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: devlens_worker_prod
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q ingestion
    volumes:
      - repo_cache_prod:/tmp/repos
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_prod:
  redis_data_prod:
  repo_cache_prod:
